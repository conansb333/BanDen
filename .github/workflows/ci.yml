name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bundle:
    name: Windows installer
    runs-on: windows-latest
    needs: [rust, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Stage watchdog binary for externalBin
        shell: pwsh
        run: |
          cargo build --release -p banden-watchdog
          New-Item -ForceItemType Directory src-tauri/binaries | Out-Null
          $triple = "${{ runner.target }}"
          if (-not $triple) { $triple = "x86_64-pc-windows-msvc" }
          Copy-Item ../../target/release/banden-watchdog.exe "src-tauri/binaries/banden-watchdog-$triple.exe" -Force
      - name: Bundle NSIS installer
        run: npx tauri build --bundles nsis --config src-tauri/tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: banden-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
